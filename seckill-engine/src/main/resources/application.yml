spring:
  application:
    name: seckill-engine
  profiles:
    active: dev
  cloud:
    nacos:
      discovery:
        enabled: true
      config:
        enabled: true
    sentinel:
      eager: true
      enabled: true
      transport:
        dashboard: localhost:8858

server:
  port: 11020

mybatis-plus:
  configuration:
    # todo: 将 log-impl: StdOutImpl 移至 application-dev.yml，生产环境不应打印 SQL 到标准输出
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

knife4j:
  enable: true

logging:
  level:
    com.seckill: DEBUG

seckill:
  redis:
    key-prefix: "seckill:"
