<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>限时秒杀</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="container">
      <h1 class="logo">🔥 限时秒杀</h1>
      <nav class="nav">
        <span id="userInfo" class="user-info"></span>
        <button id="loginBtn" class="btn btn-outline" onclick="showLoginDialog()">登录</button>
        <button id="logoutBtn" class="btn btn-outline" style="display:none" onclick="logout()">退出</button>
      </nav>
    </div>
  </header>

  <main class="main">
    <div class="container">
      <div class="activity-list" id="activityList">
        <div class="loading">加载中...</div>
      </div>
    </div>
  </main>

  <!-- 登录弹窗 -->
  <div class="modal" id="loginModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>用户登录</h2>
        <button class="close-btn" onclick="closeLoginDialog()">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>用户名</label>
          <input type="text" id="username" placeholder="请输入用户名">
        </div>
        <div class="form-group">
          <label>密码</label>
          <input type="password" id="password" placeholder="请输入密码">
        </div>
        <div class="form-actions">
          <button class="btn btn-primary" onclick="login()">登录</button>
          <button class="btn btn-text" onclick="showRegisterDialog()">注册账号</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 注册弹窗 -->
  <div class="modal" id="registerModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>用户注册</h2>
        <button class="close-btn" onclick="closeRegisterDialog()">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>用户名</label>
          <input type="text" id="regUsername" placeholder="请输入用户名">
        </div>
        <div class="form-group">
          <label>密码</label>
          <input type="password" id="regPassword" placeholder="请输入密码">
        </div>
        <div class="form-group">
          <label>确认密码</label>
          <input type="password" id="regPasswordConfirm" placeholder="请再次输入密码">
        </div>
        <div class="form-actions">
          <button class="btn btn-primary" onclick="register()">注册</button>
          <button class="btn btn-text" onclick="closeRegisterDialog()">返回登录</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 秒杀结果弹窗 -->
  <div class="modal" id="seckillModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="seckillTitle">秒杀结果</h2>
        <button class="close-btn" onclick="closeSeckillDialog()">&times;</button>
      </div>
      <div class="modal-body">
        <div id="seckillResult" class="seckill-result"></div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/countdown.js"></script>
  <script src="js/seckill.js"></script>
</body>
</html>
